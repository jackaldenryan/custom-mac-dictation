name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift and SDK
        run: |
          swift --version
          xcrun --show-sdk-version

      - name: Import signing certificate
        env:
          CODESIGN_P12: ${{ secrets.CODESIGN_P12 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
        run: |
          if [[ -z "${CODESIGN_P12:-}" ]]; then
            echo "CODESIGN_P12 secret missing; release would not keep TCC permissions."
            exit 1
          fi
          support="$HOME/Library/Application Support/CustomDictation/signing"
          mkdir -p "$support"
          echo "$CODESIGN_P12" | base64 -d > "$support/CustomDictationSigning.p12"
          printf '%s' "$CODESIGN_P12_PASSWORD" > "$support/p12-password"
          chmod 600 "$support/CustomDictationSigning.p12" "$support/p12-password"
          /usr/bin/openssl pkcs12 -in "$support/CustomDictationSigning.p12" -clcerts -nokeys \
            -passin "file:$support/p12-password" -out /tmp/custom-dictation-signing.pem
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain /tmp/custom-dictation-signing.pem
          rm -f /tmp/custom-dictation-signing.pem

      - name: Build app
        run: ./scripts/package-app.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          dmg="dist/CustomDictation-${version}.dmg"
          zip="dist/CustomDictation-${version}.zip"
          notes="Download CustomDictation-${version}.dmg, open it, and drag Custom Dictation into Applications.

          Existing installs can use Settings → Check for updates."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$dmg" "$zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$dmg" "$zip" --title "Custom Dictation ${GITHUB_REF_NAME}" --notes "$notes"
          fi
